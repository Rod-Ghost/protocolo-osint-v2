name: Tests and static checks
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e './backend[test]'
      - run: cd backend && pytest -q
  check-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check apps/web/assets/app.js
  check-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm no secrets or sensitive local files are tracked
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(\.env$|\.venv/|node_modules/|.*\.sqlite3$)' ; then
            echo 'Local or sensitive file checked into repo'
            exit 1
          fi
