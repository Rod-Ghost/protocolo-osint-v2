name: Browser E2E - real public site and encrypted local cases
on:
  pull_request:
    paths:
      - '.github/workflows/browser-e2e.yml'
      - 'tests/browser-production-flow.cjs'
      - 'tests/browser-evidence-flow.cjs'
      - 'tests/browser-capture-flow.cjs'
      - 'tests/browser-mission-shell.cjs'
      - 'tests/browser-guided-workflow.cjs'
      - 'tests/browser-case-workspace.cjs'
      - 'tests/browser-quick-investigation.cjs'
      - 'tests/browser-save-plan-no-case.cjs'
      - 'apps/web/assets/compact-investigation.css'
      - 'public/assets/compact-investigation.css'
      - 'apps/web/assets/app.js'
      - 'public/assets/app.js'
      - 'apps/web/assets/case-search-builder.js'
      - 'public/assets/case-search-builder.js'
      - 'apps/web/assets/case-workspace.js'
      - 'apps/web/assets/case-workspace.css'
      - 'public/assets/case-workspace.js'
      - 'public/assets/case-workspace.css'
      - 'apps/web/assets/guided-search-workflow.js'
      - 'apps/web/assets/guided-search-workflow.css'
      - 'public/assets/guided-search-workflow.js'
      - 'public/assets/guided-search-workflow.css'
      - 'apps/web/index.html'
      - 'apps/web/assets/mission-shell.js'
      - 'apps/web/assets/mission-shell.css'
      - 'public/assets/mission-shell.js'
      - 'public/assets/mission-shell.css'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-public-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner (ephemeral CI only)
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
      - name: Install Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium
      - name: Test public production flow without login or scans
        env:
          OSINT_E2E_URL: https://protocolo-osint-v2-nine.vercel.app
        run: node tests/browser-production-flow.cjs
      - name: Test mock OAuth and engine evidence in Chromium (offline)
        run: node tests/browser-evidence-flow.cjs
      - name: Test file capture, SHA and encrypted vault in Chromium
        run: node tests/browser-capture-flow.cjs
      - name: Mission Control desktop and mobile navigation smoke
        run: node tests/browser-mission-shell.cjs
      - name: Guided search workflow with local cases and mock sources
        run: node tests/browser-guided-workflow.cjs
      - name: Case workspace encrypted vault and responsive tabs
        run: node tests/browser-case-workspace.cjs
      - name: Quick investigation and encrypted save regression
        run: node tests/browser-quick-investigation.cjs
      - name: Save plan when no case exists (inline create, encrypted persistence)
        run: node tests/browser-save-plan-no-case.cjs
      - name: Save inline-save UX review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: save-plan-inline-ux
          path: |
            test-artifacts/save-plan-inline-desktop.png
            test-artifacts/save-plan-inline-mobile.png
            test-artifacts/save-step4-unprepared-desktop.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Save quick investigation review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quick-investigation-v28-ux-review
          path: |
            test-artifacts/quick-investigation-desktop.png
            test-artifacts/quick-investigation-mobile.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Save case workspace review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: case-workspace-ux-review
          path: |
            test-artifacts/case-workspace-desktop.png
            test-artifacts/case-workspace-mobile.png
            test-artifacts/case-workspace-mobile-locked.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Save guided-flow screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guided-workflow-ux-review
          path: |
            test-artifacts/workflow-guided-target.png
            test-artifacts/workflow-guided-sources.png
            test-artifacts/workflow-guided-results.png
            test-artifacts/workflow-guided-mobile.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Save design review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mission-shell-ux-review
          path: |
            test-artifacts/mission-shell-desktop.png
            test-artifacts/mission-shell-collapsed.png
            test-artifacts/mission-shell-mobile.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Save error-only screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-failure
          path: test-artifacts/browser-smoke-failure.png
          if-no-files-found: ignore
          retention-days: 2
