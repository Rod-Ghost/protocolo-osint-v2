services:
  osint:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      OSINT_DATA_DIR: /data
      OSINT_OCR_ENABLED: "0"
    volumes:
      - osint_data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  osint_data:
