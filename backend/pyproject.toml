[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "protocolo-osint-v2"
version = "1.1.0"
description = "Backend foundation for Protocolo OSINT V2"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2,<3",
    "httpx>=0.27,<1",
    "uvicorn>=0.30,<1",
    "pillow>=10,<13",
    "python-multipart>=0.0.9,<1",
    "mcp==2.3.0",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
ocr = ["pytesseract>=0.3,<1"]
ops = ["vercel-queue==0.10.0", "vercel-blob==0.5.1"]
reports = ["python-docx>=1.2,<2", "reportlab>=4.4,<5"]
engines = ["sherlock-project==0.16.2", "maigret==0.6.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
